<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── Reset & Base ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;
  --surface:#0f1117;
  --surface2:#161b24;
  --surface3:#1c2230;
  --border:#21283a;
  --border2:#2d3748;
  --text:#e2e8f5;
  --text2:#8892a4;
  --text3:#4a5568;
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,0.15);
  --accent2:#10b981;
  --warn:#f59e0b;
  --danger:#ef4444;
  --hot:#ff6b6b;
  --font-head:'Bricolage Grotesque',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --sidebar:220px;
  --radius:8px;
  --radius-lg:12px;
  /* overrideable by config */
  --client-accent:#3b82f6;
  --client-name:'CRM';
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body);cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:var(--font-body);outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Layout ───────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ──────────────────────────────────────── */
#sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:0;overflow:hidden;
  position:relative;z-index:10;
}
.sidebar-logo{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.logo-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--client-accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-size:14px;font-weight:600;color:#fff;
  flex-shrink:0;
}
.logo-text{font-family:var(--font-head);font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:1px}

.nav-section{padding:12px 10px 4px;font-size:10px;font-weight:500;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.08em;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;margin:1px 8px;
  border-radius:var(--radius);
  color:var(--text2);font-size:13px;font-weight:400;
  cursor:pointer;transition:all .15s;
  position:relative;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:var(--accent);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:16px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:var(--hot);color:#fff;font-size:10px;font-family:var(--font-mono);padding:1px 6px;border-radius:10px;font-weight:500}

.sidebar-footer{
  margin-top:auto;padding:12px;
  border-top:1px solid var(--border);
}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Main ─────────────────────────────────────────── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{
  height:52px;min-height:52px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 24px;gap:12px;
  background:var(--surface);
}
.topbar-title{font-family:var(--font-head);font-size:16px;font-weight:500;flex:1}
.topbar-actions{display:flex;gap:8px;align-items:center}
#page-content{flex:1;overflow-y:auto;overflow-x:hidden}

/* ── Buttons ──────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all .15s;cursor:pointer;border:none;font-family:var(--font-body)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
.btn-success{background:var(--accent2);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── Cards ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card-sm{padding:14px}
.card-title{font-family:var(--font-head);font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2)}

/* ── Stat cards ───────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 24px 0}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 20px;
  position:relative;overflow:hidden;
}
.stat-card::after{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;border-radius:50%;
  background:var(--accent-glow);
  transform:translate(20px,-20px);
}
.stat-label{font-size:11px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-value{font-family:var(--font-head);font-size:28px;font-weight:600;color:var(--text);line-height:1}
.stat-delta{font-size:11px;margin-top:6px}
.stat-delta.up{color:var(--accent2)}
.stat-delta.down{color:var(--danger)}

/* ── Table ────────────────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:500;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;font-family:var(--font-mono)}
.badge-hot{background:rgba(255,107,107,.15);color:var(--hot)}
.badge-warm{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-new{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-cold{background:var(--surface3);color:var(--text3)}
.badge-nurturing{background:rgba(16,185,129,.15);color:var(--accent2)}
.badge-enterprise{background:rgba(139,92,246,.15);color:#a78bfa}
.badge-midmarket{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-smb{background:rgba(16,185,129,.15);color:var(--accent2)}

/* ── Form inputs ──────────────────────────────────── */
.field{margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em}
.input{
  width:100%;padding:8px 12px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text);font-size:13px;
  transition:border-color .15s;
}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
.textarea{resize:vertical;min-height:120px;font-family:var(--font-mono);font-size:12px;line-height:1.65}

/* ── Tabs ─────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 24px;margin-bottom:0}
.tab{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

/* ── Segments ─────────────────────────────────────── */
.seg-colors{Enterprise:'#a78bfa','Mid-Market':var(--accent),SMB:var(--accent2)}

/* ── Toast ────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  padding:10px 18px;border-radius:var(--radius);
  font-size:13px;font-weight:500;
  opacity:0;transform:translateY(8px);
  transition:all .2s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--accent2);color:#fff}
#toast.err{background:var(--danger);color:#fff}
#toast.warn{background:var(--warn);color:#000}

/* ── Analytics page ───────────────────────────────── */
#metabase-iframe{width:100%;height:100%;border:none;display:block}
.iframe-wrap{height:100%;display:flex;flex-direction:column}

/* ── Section header ───────────────────────────────── */
.section-header{
  padding:20px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.section-title{font-family:var(--font-head);font-size:18px;font-weight:500}
.section-sub{font-size:12px;color:var(--text2);margin-top:2px}

/* ── Lead feed ────────────────────────────────────── */
.feed-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;border-bottom:1px solid var(--border);
  transition:background .12s;
}
.feed-item:hover{background:var(--surface2)}
.feed-avatar{
  width:34px;height:34px;border-radius:8px;
  background:var(--surface3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-size:13px;font-weight:600;
  color:var(--text2);flex-shrink:0;
}
.feed-name{font-size:13px;font-weight:500;color:var(--text)}
.feed-meta{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--font-mono)}
.feed-right{margin-left:auto;text-align:right}
.feed-score{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text)}
.feed-time{font-size:11px;color:var(--text3);margin-top:2px}
.score-bar{width:60px;height:3px;background:var(--surface3);border-radius:2px;margin-top:4px;margin-left:auto}
.score-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}

/* ── Template editor ──────────────────────────────── */
.tpl-layout{display:grid;grid-template-columns:200px 1fr;height:100%}
.tpl-sidebar{
  border-right:1px solid var(--border);
  overflow-y:auto;
  background:var(--surface);
  padding:12px 8px;
}
.tpl-seg-header{
  padding:6px 10px;
  font-size:10px;font-family:var(--font-mono);
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--text3);margin-top:8px;
}
.tpl-item{
  padding:8px 12px;border-radius:6px;
  cursor:pointer;transition:background .12s;
  margin-bottom:2px;
}
.tpl-item:hover{background:var(--surface2)}
.tpl-item.active{background:var(--accent-glow)}
.tpl-item-name{font-size:13px;color:var(--text2);font-weight:400}
.tpl-item.active .tpl-item-name{color:var(--accent);font-weight:500}
.tpl-item-stage{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:1px}
.tpl-editor{display:flex;flex-direction:column;overflow:hidden}
.tpl-editor-body{flex:1;overflow-y:auto;padding:20px 24px}
.var-chip{
  display:inline-block;padding:2px 8px;
  background:var(--surface3);border:1px solid var(--border2);
  border-radius:4px;font-family:var(--font-mono);font-size:11px;
  color:var(--accent);cursor:pointer;margin:2px;
  transition:background .1s;
}
.var-chip:hover{background:var(--accent-glow)}
.preview-email{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;
  font-size:14px;line-height:1.7;color:var(--text);
}
.preview-email p{margin-bottom:12px}
.preview-email ul{margin-bottom:12px;padding-left:20px}
.preview-email a{color:var(--accent)}
mark.tvar{background:rgba(59,130,246,.18);color:#93c5fd;border-radius:2px;padding:0 2px}

/* ── Importer ─────────────────────────────────────── */
.dropzone{
  border:2px dashed var(--border2);border-radius:var(--radius-lg);
  padding:48px 32px;text-align:center;
  cursor:pointer;transition:all .2s;
  background:var(--surface2);
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-glow)}
.dropzone-icon{font-size:36px;margin-bottom:12px;opacity:.5}
.mapping-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:center}
.mapping-arrow{text-align:center;color:var(--text3)}

/* ── Settings ─────────────────────────────────────── */
.settings-section{padding:20px 24px;border-bottom:1px solid var(--border)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}

/* ── Empty state ──────────────────────────────────── */
.empty{padding:60px 32px;text-align:center;color:var(--text3)}
.empty-icon{font-size:32px;margin-bottom:12px;opacity:.4}
.empty-title{font-size:15px;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px}

/* ── Loading ──────────────────────────────────────── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Scrollable panels ────────────────────────────── */
.scroll-panel{overflow-y:auto}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark" id="logo-mark">C</div>
      <div>
        <div class="logo-text" id="logo-text">CRM</div>
        <div class="logo-sub">admin panel</div>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding-top:8px">
      <div class="nav-section">Workspace</div>
      <div class="nav-item active" data-page="analytics">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="8" width="4" height="7" rx="1"/><rect x="6" y="4" width="4" height="11" rx="1"/><rect x="11" y="1" width="4" height="14" rx="1"/></svg>
        Analytics
      </div>
      <div class="nav-item" data-page="feed">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v14M1 5h6M1 9h6M9 7h6M9 11h6"/></svg>
        Live feed
        <span class="nav-badge" id="hot-badge" style="display:none">0</span>
      </div>

      <div class="nav-section" style="margin-top:8px">Automation</div>
      <div class="nav-item" data-page="templates">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="14" height="14" rx="2"/><path d="M4 5h8M4 8h5M4 11h3"/></svg>
        Email templates
      </div>
      <div class="nav-item" data-page="importer">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v9M5 7l3 3 3-3"/><path d="M2 12v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>
        Lead importer
      </div>

      <div class="nav-section" style="margin-top:8px">System</div>
      <div class="nav-item" data-page="settings">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>
        Settings
      </div>
    </div>

    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--text3)">
        <span class="status-dot"></span>n8n connected
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div id="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Analytics</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div id="page-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG & STATE
// ══════════════════════════════════════════════════════════
const DEFAULT_CONFIG = {
  client: {
    name: "CRM Dashboard",
    logo_letter: "C",
    primary_color: "#3b82f6"
  },
  integrations: {
    n8n_webhook_lead_capture: "",
    n8n_webhook_templates: "",
    n8n_webhook_live_feed: "",
    metabase_url: "https://dashboard.theworkflowengineer.ovh/dashboard/3-crm-dashboard",
    metabase_embed_type: "public"
  },
  features: {
    template_editor: true,
    csv_importer: true,
    live_feed: true,
    analytics: true
  }
};

let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let currentPage = "analytics";
let templates = null;
let feedData = [];
let feedTimer = null;

// Template state
let tplSeg = "Enterprise";
let tplStage = 1;
let tplView = "editor";
let tplAiInput = "";
let tplAiLoading = false;

// Importer state
let importRows = [];
let importHeaders = [];
let importMapping = {};

const SEGMENTS = ["Enterprise","Mid-Market","SMB"];
const STAGES = [
  {n:1,label:"Stage 1 — Intro"},
  {n:2,label:"Stage 2 — Follow-up"},
  {n:3,label:"Stage 3 — Demo ask"},
  {n:4,label:"Stage 4 — Break-up"}
];
const VARS = ["{{name}}","{{company}}","{{email}}","{{id}}","{{segment}}"];
const PREVIEW_DATA = {name:"Sarah Chen",company:"Acme Corp",email:"sarah@acmecorp.com",id:"12345678",segment:"Enterprise"};

const CRM_FIELDS = [
  {key:"name",label:"Name",required:true},
  {key:"email",label:"Email",required:true},
  {key:"company",label:"Company",required:false},
  {key:"linkedin",label:"LinkedIn",required:false},
  {key:"message",label:"Message",required:false},
  {key:"source",label:"Source",required:false},
  {key:"referred_by",label:"Referred By",required:false},
];

// ══════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════
async function boot() {
  // Load config.json (falls back to defaults if missing)
  try {
    const r = await fetch("config.json");
    if (r.ok) {
      const c = await r.json();
      CONFIG = deepMerge(DEFAULT_CONFIG, c);
    }
  } catch(e) {
    // No config.json — use defaults, configure via Settings page
  }

  // Load saved settings from localStorage
  try {
    const saved = localStorage.getItem("crm_config");
    if (saved) CONFIG = deepMerge(CONFIG, JSON.parse(saved));
  } catch(e) {}

  applyBranding();
  await loadTemplates();
  navigate(location.hash.replace("#","") || "analytics");
  setupNav();
}

function deepMerge(a, b) {
  const out = Object.assign({}, a);
  for (const k in b) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) {
      out[k] = deepMerge(a[k] || {}, b[k]);
    } else {
      out[k] = b[k];
    }
  }
  return out;
}

function applyBranding() {
  const c = CONFIG.client;
  document.title = c.name + " — Admin";
  document.getElementById("logo-text").textContent = c.name;
  document.getElementById("logo-mark").textContent = c.logo_letter || c.name[0];
  document.documentElement.style.setProperty("--accent", c.primary_color || "#3b82f6");
  document.documentElement.style.setProperty("--accent-glow",
    c.primary_color ? c.primary_color + "22" : "rgba(59,130,246,0.15)");
}

// ══════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════
function setupNav() {
  document.querySelectorAll(".nav-item[data-page]").forEach(el => {
    el.addEventListener("click", () => navigate(el.dataset.page));
  });
}

function navigate(page) {
  currentPage = page;
  location.hash = page;

  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.page === page);
  });

  const titles = {
    analytics: "Analytics",
    feed: "Live lead feed",
    templates: "Email templates",
    importer: "Lead importer",

function renderFeedTable() {
  const search = (document.getElementById("feed-search")?.value||"").toLowerCase();
  const statusFilter = document.getElementById("feed-status")?.value||"";
  const segFilter = document.getElementById("feed-segment")?.value||"";

  let rows = feedData.filter(l => {
    const matchSearch = !search ||
      (l.name||"").toLowerCase().includes(search) ||
      (l.email||"").toLowerCase().includes(search) ||
      (l.company||"").toLowerCase().includes(search);
    const matchStatus = !statusFilter || l.status === statusFilter;
    const matchSeg = !segFilter || l.segment === segFilter;
    return matchSearch && matchStatus && matchSeg;
  });

  const statusBadge = s => {
    const map = {Hot:"badge-hot",Nurturing:"badge-nurturing",New:"badge-new",Cold:"badge-cold"};
    return `<span class="badge ${map[s]||"badge-cold"}">● ${s||"Unknown"}</span>`;
  };
  const segBadge = s => {
    const map = {Enterprise:"badge-enterprise","Mid-Market":"badge-midmarket",SMB:"badge-smb"};
    return `<span class="badge ${map[s]||"badge-cold"}">${s||"-"}</span>`;
  };
  const timeAgo = iso => {
    if (!iso) return "-";
    const d = (Date.now() - new Date(iso)) / 1000;
    if (d < 60) return "just now";
    if (d < 3600) return Math.floor(d/60)+"m ago";
    if (d < 86400) return Math.floor(d/3600)+"h ago";
    return Math.floor(d/86400)+"d ago";
  };

  const hotCount = feedData.filter(l=>l.status==="Hot").length;
  const badge = document.getElementById("hot-badge");
  if (badge) { badge.textContent=hotCount; badge.style.display=hotCount>0?"inline":"none"; }

  const body = document.getElementById("feed-body");
  if (!body) return;

  if (rows.length === 0) {
    body.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No leads match</div><div class="empty-sub">Try adjusting your filters</div></div>`;
    return;
  }

  body.innerHTML = `
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Lead</th><th>Company</th><th>Segment</th>
        <th>Status</th><th>Score</th><th>Source</th><th>Last activity</th>
      </tr></thead>
      <tbody>
        ${rows.map(l => `
        <tr>
          <td>
            <div style="font-weight:500;color:var(--text)">${l.name||"-"}</div>
            <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono)">${l.email||""}</div>
          </td>
          <td>${l.company||"-"}</td>
          <td>${segBadge(l.segment)}</td>
          <td>${statusBadge(l.status)}</td>
          <td>
            <div style="font-family:var(--font-mono);font-size:13px">${l.lead_score||0}</div>
            <div style="width:50px;height:3px;background:var(--surface3);border-radius:2px;margin-top:4px">
              <div style="width:${Math.min(l.lead_score||0,100)}%;height:100%;background:${(l.lead_score||0)>=50?"var(--hot)":"var(--accent)"};border-radius:2px"></div>
            </div>
          </td>
          <td><span style="font-size:11px;font-family:var(--font-mono);color:var(--text2)">${l.source||"-"}</span></td>
          <td><span style="font-size:12px;color:var(--text3)">${timeAgo(l.last_activity)}</span></td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function updateHotBadge() {
  const hot = feedData.filter(l=>l.status==="Hot").length;
  const b = document.getElementById("hot-badge");
  if (b) { b.textContent=hot; b.style.display=hot>0?"inline":"none"; }

function selectTpl(seg, stage) {
  tplSeg = seg; tplStage = stage; tplView = "editor";
  const pane = document.getElementById("tpl-editor-pane");

    el.classList.toggle("active",
      el.onclick?.toString().includes(`'${seg}'`) &&
      el.onclick?.toString().includes(`,${stage})`));
  });
  // Re-render sidebar properly
  document.querySelector(".tpl-sidebar").innerHTML = buildTplSidebar();

    el.addEventListener("click", function() {

  rebindTplSidebar();

  document.querySelectorAll(".tpl-item[data-seg]").forEach(el => {

function setTplView(v) {
  tplView = v;
  const pane = document.getElementById("tpl-editor-pane");

}

function bindTplInputs() {
  const subj = document.getElementById("tpl-subject");
  if (subj) {
    subj.addEventListener("input", e => {
      templates[tplSeg][tplStage].subject = e.target.value;
    });
  }
  const html = document.getElementById("tpl-html");
  if (html) {
    html.value = templates[tplSeg][tplStage].html;
    html.addEventListener("input", e => {
      templates[tplSeg][tplStage].html = e.target.value;
    });
  }
  const ai = document.getElementById("tpl-ai");
  if (ai) {
    ai.value = tplAiInput;
    ai.addEventListener("input", e => tplAiInput = e.target.value);
    ai.addEventListener("keydown", e => { if (e.key==="Enter") runAiImprove(); });
  }
  // Re-bind sidebar
  document.querySelectorAll(".tpl-item").forEach(el => {
    const m = el.querySelector(".tpl-item-name")?.textContent.match(/Stage (\d)/);
    if (!m) return;
    const stage = parseInt(m[1]);
    const seg = el.closest(".tpl-sidebar")
      ? (() => {
          let node = el.previousElementSibling;
          while(node) {
            if (node.classList.contains("tpl-seg-header")) return node.textContent.trim();
            node = node.previousElementSibling;
          }
          return "Enterprise";
        })()
      : "Enterprise";
  });
}

function insertVar(v) {
  const el = document.getElementById("tpl-html");
  if (!el) return;
  const s = el.selectionStart, e2 = el.selectionEnd;
  const newVal = el.value.slice(0,s) + v + el.value.slice(e2);
  templates[tplSeg][tplStage].html = newVal;
  el.value = newVal;
  el.focus(); el.selectionStart = el.selectionEnd = s + v.length;
}

function resetTpl() {
  templates[tplSeg][tplStage] = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES[tplSeg][tplStage]));
  const pane = document.getElementById("tpl-editor-pane");
  if (pane) { pane.innerHTML = buildTplEditor(); bindTplInputs(); }
  toast("Reset to default", "ok");
}

      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        messages:[{role:"user",content:`You are a B2B SaaS email copywriter. Improve this cold outreach email.\n\nSegment: ${tplSeg} | Stage: ${tplStage}/4 (${["Intro","Follow-up","Demo ask","Break-up"][tplStage-1]})\nSubject: ${cur.subject}\nHTML body:\n${cur.html}\n\nInstruction: ${instruction}\n\nRules:\n- Keep ALL {{name}}, {{company}}, {{email}}, {{id}}, {{segment}} tokens exactly as-is\n- Keep all <a href> links intact\n- Keep the email short and B2B professional\n- Return ONLY raw JSON: {"subject":"...","html":"..."}\n- No markdown, no explanation`}]
      })
    });
    const d = await r.json();
    const text = (d.content||[]).find(b=>b.type==="text")?.text||"";
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    if (parsed.subject) templates[tplSeg][tplStage].subject = parsed.subject;
    if (parsed.html) templates[tplSeg][tplStage].html = parsed.html;
    tplAiInput = "";
    const pane = document.getElementById("tpl-editor-pane");
    if (pane) { pane.innerHTML = buildTplEditor(); bindTplInputs(); }
    toast("AI updated template ✓","ok");
  } catch(e) {
    toast("AI improvement failed","err");
  }
  if (btn) { btn.disabled=false; btn.textContent="Improve"; }
}

function renderPreview(html) {
  let out = html;
  Object.entries(PREVIEW_DATA).forEach(([k,v]) => {
    out = out.split(`{{${k}}}`).join(`<mark class="tvar">${v}</mark>`);
  });
  return out;
}

function exportTemplates() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(templates,null,2)],{type:"application/json"}));
  a.download = "email-templates.json"; a.click();
}

function importTemplates(e) {
  const file = e.target.files?.[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      templates = JSON.parse(ev.target.result);
      localStorage.setItem("crm_templates", JSON.stringify(templates));
      renderPage("templates"); toast("Templates imported","ok");
    } catch { toast("Invalid JSON","err"); }
  };
  r.readAsText(file); e.target.value="";
}

function renderImporter(el, acts) {

      <div class="dropzone" id="dropzone"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="handleDrop(event)"
        onclick="document.getElementById('file-input').click()">

    </div>

            <div class="card-sub" id="import-row-count"></div>

function handleDrop(e) {
  e.preventDefault();
  document.getElementById("dropzone")?.classList.remove("drag");
  const file = e.dataTransfer.files?.[0];
  if (file) processFile(file);
}

function handleFile(e) {
  const file = e.target.files?.[0];
  if (file) processFile(file);
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {header:1});
      if (data.length < 2) { toast("File appears empty","err"); return; }
      importHeaders = data[0].map(h => String(h||"").trim());
      importRows = data.slice(1).filter(r => r.some(c => c != null && c !== ""));

      // Auto-map headers
      importMapping = {};
      CRM_FIELDS.forEach(f => {
        const match = importHeaders.findIndex(h =>
          h.toLowerCase().replace(/[^a-z]/g,"").includes(f.key.toLowerCase()) ||
          f.key.toLowerCase().includes(h.toLowerCase().replace(/[^a-z]/g,""))
        );
        if (match >= 0) importMapping[f.key] = match;
      });

      document.getElementById("import-file-name").textContent = file.name;
      document.getElementById("import-row-count").textContent = `${importRows.length} rows detected`;
      buildMappingUI();
      document.getElementById("import-step-1").style.display = "none";
      document.getElementById("import-step-2").style.display = "block";
    } catch(e) { toast("Could not parse file — check format","err"); }
  };
  reader.readAsArrayBuffer(file);
}

function buildMappingUI() {
  const ui = document.getElementById("mapping-ui");
  if (!ui) return;
  ui.innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:center;margin-bottom:8px;padding:0 0 8px;border-bottom:1px solid var(--border)">
    <div style="font-size:11px;font-family:var(--font-mono);color:var(--text3);text-transform:uppercase">Your column</div>
    <div></div>
    <div style="font-size:11px;font-family:var(--font-mono);color:var(--text3);text-transform:uppercase">CRM field</div>
  </div>
  ${CRM_FIELDS.map(f => `
  <div style="display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:center;margin-bottom:8px">
    <select class="input input-sm" id="map-${f.key}" style="font-size:12px">
      <option value="">— skip —</option>
      ${importHeaders.map((h,i) => `<option value="${i}" ${importMapping[f.key]===i?"selected":""}>${h}</option>`).join("")}
    </select>
    <div style="text-align:center;color:var(--text3);font-size:14px">→</div>
    <div style="font-size:13px;font-weight:500;color:var(--text)">${f.label} ${f.required?'<span style="color:var(--danger)">*</span>':''}</div>
  </div>`).join("")}`;
}

async function runImport() {
  // Read current mapping from selects
  CRM_FIELDS.forEach(f => {
    const sel = document.getElementById("map-"+f.key);
    if (sel && sel.value !== "") importMapping[f.key] = parseInt(sel.value);
    else delete importMapping[f.key];
  });

  if (!importMapping.email) { toast("Email column is required","err"); return; }

  const webhookUrl = CONFIG.integrations.n8n_webhook_lead_capture;
  const btn = document.getElementById("import-btn");
  if (btn) { btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Importing…`; }

  let ok = 0, fail = 0;

  for (const row of importRows) {
    const payload = { source: "4wf5673" }; // website_form source code
    CRM_FIELDS.forEach(f => {
      if (importMapping[f.key] != null) {
        payload[f.key] = row[importMapping[f.key]] != null ? String(row[importMapping[f.key]]).trim() : "";
      }
    });
    if (!payload.email) continue;

    if (webhookUrl) {
      try {
        await fetch(webhookUrl, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });
        ok++;
      } catch { fail++; }
    } else {
      // Simulate delay for demo mode
      await new Promise(r => setTimeout(r, 30));
      ok++;
    }
  }

  document.getElementById("import-step-2").style.display = "none";
  document.getElementById("import-step-3").style.display = "block";
  document.getElementById("import-result-title").textContent = `${ok} leads imported successfully`;
  document.getElementById("import-result-sub").textContent = fail > 0
    ? `${fail} rows failed — check your webhook logs in n8n`
    : webhookUrl
      ? "All leads sent to your n8n lead capture webhook"
      : "Demo mode — configure webhook URL in Settings to send to n8n";
}

function resetImporter() {
  importRows=[]; importHeaders=[]; importMapping={};
  renderPage("importer");
}

// UTILITIES

function escHtml(str) {
  return String(str||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let toastTimer;
function toast(msg, type="ok") {
  clearTimeout(toastTimer);
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "show "+type;
  toastTimer = setTimeout(() => el.className = "", 3000);
}
