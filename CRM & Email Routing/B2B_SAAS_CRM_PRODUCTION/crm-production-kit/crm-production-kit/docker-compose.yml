version: '3.8'

# ─────────────────────────────────────────────────────────────
# Required .env variables — copy .env.example to .env and fill in
# ─────────────────────────────────────────────────────────────

volumes:
  n8n_storage:
  postgres_storage:
  qdrant_storage:
  traefik_data:
  metabase_storage:

networks:
  backend:
    driver: bridge

x-n8n: &service-n8n
  image: n8nio/n8n:1.85.0
  labels:
    - traefik.enable=true
    - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN_1}.${DOMAIN_NAME}`)
    - traefik.http.routers.n8n.tls=true
    - traefik.http.routers.n8n.entrypoints=websecure
    - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
    - traefik.http.middlewares.n8n.headers.SSLRedirect=true
    - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
    - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
    - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
    - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
    - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
    - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
    - traefik.http.middlewares.n8n.headers.STSPreload=true
    - traefik.http.routers.n8n.middlewares=n8n@docker
    - traefik.http.services.n8n.loadbalancer.server.port=5678
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - N8N_HOST=${SUBDOMAIN_1}.${DOMAIN_NAME}
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - N8N_TRUST_PROXY=true
    - NODE_ENV=production
    - WEBHOOK_URL=https://${SUBDOMAIN_1}.${DOMAIN_NAME}/
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    - TZ=${TZ}
    - N8N_BASIC_AUTH_ACTIVE=true
    - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
    - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - EXECUTIONS_PROCESS=main
    - EXECUTIONS_MODE=regular
    - NODE_OPTIONS=--max-old-space-size=4096
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
  env_file:
    - .env
  networks:
    - backend

services:

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  metabase:
    image: metabase/metabase:v0.52.5
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_EMBEDDING_APP_ORIGIN: "https://${SUBDOMAIN_3}.${DOMAIN_NAME}"
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - metabase_storage:/metabase_data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.metabase.rule=Host(`${SUBDOMAIN_2}.${DOMAIN_NAME}`)
      - traefik.http.routers.metabase.entrypoints=websecure
      - traefik.http.routers.metabase.tls.certresolver=mytlschallenge
      - traefik.http.services.metabase.loadbalancer.server.port=3000
    networks:
      - backend

  crm-dashboard:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/config.json:/usr/share/nginx/html/config.json:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm-dashboard.rule=Host(`${SUBDOMAIN_3}.${DOMAIN_NAME}`)
      - traefik.http.routers.crm-dashboard.entrypoints=websecure
      - traefik.http.routers.crm-dashboard.tls.certresolver=mytlschallenge
      - traefik.http.services.crm-dashboard.loadbalancer.server.port=80
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.13.4
    hostname: qdrant
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    entrypoint: |
      sh -c '
        trap "exit 0" SIGTERM SIGINT
        echo "Backup service started. First backup in 2 minutes."
        sleep 120
        while true; do
          TIMESTAMP=$$(date +%Y-%m-%d_%H-%M-%S)
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB \
            | gzip > /backups/backup_$$TIMESTAMP.sql.gz
          find /backups -name "*.sql.gz" -mtime +7 -delete
          echo "Backup complete. Next in 24h."
          sleep 86400
        done
      '
    networks:
      - backend
